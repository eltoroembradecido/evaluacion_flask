<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 2</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Formulario de Nombres</h1>
        <form method="POST">
            <label>Nombre 1:</label>
            <input type="text" name="nombre1" required><br><br>
            <label>Nombre 2:</label>
            <input type="text" name="nombre2" required><br><br>
            <label>Nombre 3:</label>
            <input type="text" name="nombre3" required><br><br>
            <button type="submit" class="btn">Enviar</button>
        </form>

        {% if nombre_largo is defined %}
            <div class="resultado">
                <p>El nombre con mayor cantidad de caracteres es: <strong>{{ nombre_largo }}</strong></p>
                <p>El nombre tiene: <strong>{{ cantidad }} caracteres</strong></p>
            </div>
        {% endif %}
        <br>
        <a href="/">Volver al Menú</a>
    </div>
</body>
</html>
